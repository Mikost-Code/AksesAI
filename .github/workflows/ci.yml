name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama pada branch/PR yang sama ketika ada push baru.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Secret scan
        run: node scripts/secret-scan.mjs

      # Build memakai Supabase palsu yang valid secara format: build tidak butuh
      # koneksi database, tetapi env publik harus terparsing oleh skema Zod.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-real

      - name: Client bundle must not contain service_role
        run: node scripts/check-client-bundle.mjs

  rls-and-e2e:
    name: RLS, integration & E2E (Supabase lokal)
    runs-on: ubuntu-latest
    # Uji ini menyalakan Supabase lokal di runner (butuh Docker, tersedia di
    # ubuntu-latest) sehingga ketergantungan eksternal tidak diperlukan.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase local
        run: npx supabase start
        timeout-minutes: 15

      - name: Apply migrations & seed
        run: npx supabase db reset

      - name: Export local Supabase env
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(npx supabase status -o env | grep -E '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(npx supabase status -o env | grep -E '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: RLS & integration tests
        run: pnpm test:rls
        env:
          CRON_SECRET: ci-cron-secret-at-least-32-characters-long
          IP_HASH_SALT: ci-ip-hash-salt-at-least-16

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          CRON_SECRET: ci-cron-secret-at-least-32-characters-long
          IP_HASH_SALT: ci-ip-hash-salt-at-least-16

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup || true
